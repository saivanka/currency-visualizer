# Production compose file used on the EC2 instance.
# Unlike docker-compose.yml (local dev), this pulls prebuilt images from
# GitHub Container Registry instead of building on the server.
#
# Required environment variables (see deploy/.env.example):
#   GHCR_IMAGE_BACKEND, GHCR_IMAGE_FRONTEND, IMAGE_TAG,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${GHCR_IMAGE_BACKEND}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${GHCR_IMAGE_FRONTEND}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
