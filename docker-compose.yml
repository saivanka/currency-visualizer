# Local development / single-command demo.
# For EC2 production, use docker-compose.prod.yml (pulls prebuilt images
# from GHCR instead of building on the server).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-currency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-currency}
      POSTGRES_DB: ${POSTGRES_DB:-currency}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-currency}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - currency-net

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-currency}:${POSTGRES_PASSWORD:-currency}@db:5432/${POSTGRES_DB:-currency}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - currency-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - currency-net

networks:
  currency-net:
    driver: bridge

volumes:
  db_data:
